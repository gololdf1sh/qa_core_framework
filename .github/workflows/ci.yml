name: CI - Automation Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      grep:
        description: Filter tests
        required: false
        default: ''
      run:
        description: Testomat run id (sent by Testomat)
        required: false
        default: ''

jobs:
  tests:
    name: Playwright Tests
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      TESTOMATIO: ${{ secrets.TESTOMATIO }}
      TESTOMATIO_RUN: ${{ github.event.inputs.run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests and send to Testomat
        run: npm test -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Finish Testomat run
        if: always()
        run: |
          npx @testomatio/reporter finish

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          #name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7